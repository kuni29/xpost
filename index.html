<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Xで開く</title>
<style>body{font-family:-apple-system,sans-serif;max-width:560px;margin:40px auto;padding:0 20px;color:#111}
pre{white-space:pre-wrap;background:#f4f4f5;padding:14px;border-radius:10px;font-size:15px}
a.b{display:block;text-align:center;padding:14px;border-radius:999px;background:#111;color:#fff;text-decoration:none;margin:12px 0;font-weight:600}
a.s{background:#fff;color:#111;border:1px solid #ccc}</style></head>
<body>
<p id="msg">Xアプリを開いています…</p>
<pre id="t"></pre>
<a class="b" id="app" href="#">Xアプリで開く</a>
<a class="b s" id="web" href="#">ブラウザで開く</a>
<script>
const p=new URLSearchParams(location.search);
const t=p.get('t')||'';const r=p.get('r');
document.getElementById('t').textContent=t;
let app='twitter://post?message='+encodeURIComponent(t);
let web='https://x.com/intent/post?text='+encodeURIComponent(t)+(r?'&in_reply_to='+encodeURIComponent(r):'');
if(r) app='twitter://post?message='+encodeURIComponent(t)+'&in_reply_to_status_id='+encodeURIComponent(r);
document.getElementById('app').href=app;document.getElementById('web').href=web;
if(t){location.href=app;setTimeout(()=>{document.getElementById('msg').textContent='開かない場合は下のボタンを押してください';},1500);}
else document.getElementById('msg').textContent='文面がありません';
</script></body></html>
